<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf0ef">
<title>Perfil académico · Ramón Alberto Curbalán Vega</title>
<style>
:root{color-scheme:light;--bg:#edf0ef;--ink:#283337;--line:#d3dad8;--gold:#806c46}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;min-height:100dvh}
header{padding:14px clamp(14px,3vw,42px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#f8f9f7}
.title strong{display:block;font-size:clamp(13px,1.6vw,19px);letter-spacing:.01em}
.title span{display:block;color:#657179;font-size:11px;margin-top:4px}
a.return{flex-shrink:0;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);border:1px solid #bdc9c7;padding:11px 15px;background:#fff;font-size:12px;font-weight:700}
a.return:hover,a.return:focus-visible{border-color:var(--gold);outline:2px solid transparent}
main{flex:1;display:flex;flex-direction:column;padding:clamp(8px,1.6vw,22px)}
.viewer{width:100%;flex:1;min-height:65vh;background:#fff;border:1px solid var(--line);box-shadow:0 12px 34px #28333714}
.viewer iframe{display:block;width:100%;height:100%;min-height:65vh;border:0}
footer{font-size:11px;color:#657179;padding:7px 0 0;text-align:center}
@media(max-width:650px){header{align-items:flex-start}.title span{max-width:200px}.viewer,.viewer iframe{min-height:76dvh}}
</style>
</head>
<body>
<header>
<div class="title"><strong>Perfil académico</strong><span>Dossier académico y formación profesional · 10 diapositivas</span></div>
<a class="return" href="./index.html">← Volver al portfolio</a>
</header>
<main>
<div class="viewer" aria-label="Presentación académica">
<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=https%3A%2F%2Fd2ol7oe51mr4n9.cloudfront.net%2Fuser_3IHAZtjGdFzomzk5Pp0lAW9zg6A%2F742bd82e-8dc4-494d-99e1-122c81a3d792.pptx" title="Presentación original del perfil académico" loading="eager" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
<footer>Presentación en línea · Puede cambiar de diapositiva desde el visor.</footer>
</main>
</body></html>
