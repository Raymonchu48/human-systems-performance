name: Restore stable clean cluster master

on:
  push:
    branches: [main]
    paths:
      - 'tools/restore_clean_master.py'
      - '.github/workflows/restore-clean-master.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore known-good master
        run: python tools/restore_clean_master.py
      - name: Remove one-off workflow and commit
        run: |
          rm -f .github/workflows/restore-clean-master.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore stable clean cluster master"
          git push
