name: Integrate IT profile natively
on:
  push:
    branches: [main]
    paths:
      - 'tools/integrate_it_cutout.py'
      - '.github/workflows/integrate-it-cutout.yml'
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy opencv-python-headless
      - run: python tools/integrate_it_cutout.py
      - run: |
          rm -f .github/workflows/integrate-it-cutout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate IT profile into native Technology scene"
          git push
