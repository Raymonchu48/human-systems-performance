name: Apply approved central cluster

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_approved_center.py'
      - '.github/workflows/apply-approved-center.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build approved center into single master image
        run: python tools/apply_approved_center.py
      - name: Commit definitive master and remove one-off workflow
        run: |
          rm -f .github/workflows/apply-approved-center.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply approved central cluster directly into master"
          git push
