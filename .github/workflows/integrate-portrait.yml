name: Integrate approved portrait into cluster master

on:
  push:
    branches: [main]
    paths:
      - '.tmp/portrait2/**'
      - 'tools/integrate_portrait.py'
      - '.github/workflows/integrate-portrait.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Bake portrait into single cluster master
        run: python tools/integrate_portrait.py

      - name: Remove one-off workflow and commit definitive master
        run: |
          rm -f .github/workflows/integrate-portrait.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bake approved portrait into single cluster master asset"
          git push
