name: Publicar perfil profesional PowerPoint
on:
  push:
    paths:
      - '.github/workflows/publicar-perfil-profesional.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx pymupdf Pillow
      - name: Generar PowerPoint editable y actualizar botones
        shell: bash
        run: |
          python - <<'PY'
          from pptx import Presentation
          from pptx.util import Inches,Pt
          from pptx.dml.color import RGBColor
          from pptx.enum.shapes import MSO_SHAPE
          from pptx.enum.text import PP_ALIGN,MSO_ANCHOR
          from pathlib import Path
          import fitz,re
          src=Path('assets/Perfil_Profesional_Integral_Ramon_Curbalan.pdf')
          if not src.exists(): raise FileNotFoundError(src)
          doc=fitz.open(src)
          prs=Presentation(); prs.slide_width=Inches(13.333);prs.slide_height=Inches(7.5)
          NAVY=RGBColor(7,27,39);CARD=RGBColor(16,40,56);WHITE=RGBColor(240,246,248);SOFT=RGBColor(185,203,213)
          GOLD=RGBColor(213,173,77);CYAN=RGBColor(39,185,222);GREEN=RGBColor(76,182,111)
          def shape(sl,x,y,w,h,color,rounded=False):
              z=sl.shapes.add_shape(MSO_SHAPE.ROUNDED_RECTANGLE if rounded else MSO_SHAPE.RECTANGLE,Inches(x),Inches(y),Inches(w),Inches(h))
              z.fill.solid();z.fill.fore_color.rgb=color;z.line.fill.background();return z
          def txt(sl,s,x,y,w,h,size=17,color=WHITE,bold=False):
              bx=sl.shapes.add_textbox(Inches(x),Inches(y),Inches(w),Inches(h));tf=bx.text_frame;tf.word_wrap=True
              tf.margin_left=Inches(.02);tf.margin_top=Inches(.01);tf.margin_right=Inches(.02)
              for j,line in enumerate(s.split('\n')):
                  p=tf.paragraphs[0] if j==0 else tf.add_paragraph()
                  p.text=line;p.font.name='Aptos';p.font.size=Pt(size);p.font.bold=bold;p.font.color.rgb=color
              return bx
          def clean(page):
              spans=[]
              for block in page.get_text('dict')['blocks']:
                  if 'lines' not in block:continue
                  for l in block['lines']:
                      ss=''.join(s['text'] for s in l['spans']).strip()
                      if ss and not ss.startswith('Human - Systems') and not ss.startswith('RAMÓN A. CURBALÁN VEGA |'):
                          spans.append((l['bbox'][1],ss))
              return [v for _,v in sorted(spans)]
          sections=[
          ('PERFIL PROFESIONAL INTEGRAL','Dirección operativa · Tecnología aplicada · Rendimiento humano',GOLD),
          ('RESUMEN EJECUTIVO','Personas, procesos, datos y ejecución',GOLD),
          ('HOSTELERÍA, F&B Y EVENTOS','Dirección operativa · Servicio premium · KPI',GOLD),
          ('TECNOLOGÍA, SISTEMAS Y AUTOMATIZACIÓN','Sistemas · Redes · Ciberseguridad · Datos · IA',CYAN),
          ('DEPORTE, NUTRICIÓN Y RENDIMIENTO','Entrenamiento · Hábitos · Bienestar',GREEN),
          ('PROYECTOS Y ECOSISTEMA DIGITAL','Innovación y proyectos propios',CYAN),
          ('FORMACIÓN Y CERTIFICACIONES','Especialización técnica y profesional',GOLD),
          ('METODOLOGÍA Y PROPUESTA DE VALOR','Human · Systems · Performance',GREEN)]
          for i,(title,sub,accent) in enumerate(sections):
              sl=prs.slides.add_slide(prs.slide_layouts[6]);shape(sl,0,0,13.333,7.5,NAVY)
              shape(sl,.55,.48,.82,.045,GOLD);shape(sl,1.45,.48,.82,.045,CYAN);shape(sl,2.35,.48,.82,.045,GREEN)
              txt(sl,'RAMÓN A. CURBALÁN VEGA',.57,.67,10,.3,12,SOFT,True)
              txt(sl,title,.57,1.12,12.2,.66,26,WHITE,True);txt(sl,sub,.59,1.85,11.8,.4,16,accent)
              shape(sl,.57,2.45,12.15,4.35,CARD,True)
              lines=clean(doc[i])
              lines=[v for v in lines if len(v)>3 and v not in {title,sub} and not re.match(r'^\d{1,2}$',v)]
              if i==0:
                  text='Un perfil multidisciplinar que conecta dirección operativa, tecnología aplicada y rendimiento humano.\n\n23+ años de experiencia profesional · Mallorca, España\n\nHOSTELERÍA  |  TECNOLOGÍA  |  DEPORTE'
                  txt(sl,text,.91,2.91,11.2,3.45,23,WHITE)
              else:
                  # Selected readable source text; no rasterized pages, editable text.
                  body=[]
                  for line in lines:
                      if line.lower().startswith(('actualizado:', 'mallorca, españa')):continue
                      if len(line)<5:continue
                      body.append(line.replace('F&B;', 'F&B'))
                  text='\n'.join(body[:22])
                  size=15 if len(text)<600 else 12 if len(text)<930 else 10.5
                  txt(sl,text,.91,2.73,11.55,3.88,size,WHITE)
              txt(sl,f'HUMAN  —  SYSTEMS  —  PERFORMANCE',.58,7.06,10,.22,10,SOFT)
              txt(sl,str(i+1).zfill(2),12.1,7.05,.6,.25,11,accent,True)
          out=Path('assets/Perfil_Profesional_Integral_Ramon_Curbalan.pptx')
          prs.save(out)
          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          old='assets/Perfil_Profesional_Integral_Ramon_Curbalan.pdf'
          new='assets/Perfil_Profesional_Integral_Ramon_Curbalan.pptx'
          if old not in html:raise RuntimeError('No se ha encontrado el enlace original')
          index.write_text(html.replace(old,new),encoding='utf-8')
          print('Presentación creada y enlaces actualizados')
          PY
      - name: Publicar archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/Perfil_Profesional_Integral_Ramon_Curbalan.pptx
          git commit -m "Publicar perfil profesional integral en PowerPoint" || exit 0
          git push
