name: Rebuild technology section in master cluster

on:
  push:
    branches: [main]
    paths:
      - 'tools/rebuild_technology.py'
      - '.github/workflows/rebuild-technology.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Rebuild Technology directly inside cluster master
        run: python tools/rebuild_technology.py
      - name: Commit final master and remove one-off workflow
        run: |
          rm -f .github/workflows/rebuild-technology.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild technology section directly in cluster master"
          git push
