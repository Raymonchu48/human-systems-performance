name: Repair central nucleus in master cluster

on:
  push:
    branches: [main]
    paths:
      - 'tools/repair_center.py'
      - '.github/workflows/repair-center.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Rebuild central nucleus inside single master
        run: python tools/repair_center.py
      - name: Remove one-off workflow and commit repaired master
        run: |
          rm -f .github/workflows/repair-center.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair central nucleus without touching HUD nodes"
          git push
