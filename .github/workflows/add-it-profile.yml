name: Add IT profile asset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-it-profile.yml'
permissions:
  contents: write
jobs:
  add:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -L --fail 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IHAZtjGdFzomzk5Pp0lAW9zg6A/94746310-7c1c-4281-be3e-1cc7c81464b4.jpg' -o assets/it-profile.jpg
          rm -f .github/workflows/add-it-profile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add IT profile source asset"
          git push
