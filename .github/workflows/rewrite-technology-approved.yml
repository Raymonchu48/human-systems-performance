name: Rewrite approved technology section
on:
  push:
    branches: [main]
    paths:
      - 'tools/rewrite_technology_approved.py'
      - '.github/workflows/rewrite-technology-approved.yml'
permissions:
  contents: write
jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/rewrite_technology_approved.py
      - run: |
          rm -f .github/workflows/rewrite-technology-approved.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rewrite approved Technology section directly in cluster master"
          git push
