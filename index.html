<script>
const modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),body=document.getElementById('modalBody');
const copy={
'Inicio':'Tres disciplinas. Una misma forma de pensar: personas, procesos, tecnología y rendimiento.',
'Mi perfil':'Perfil multidisciplinar que integra dirección de F&B y eventos, sistemas y transformación digital, entrenamiento, nutrición y gestión de proyectos.',
'Experiencia':'Más de dos décadas de experiencia profesional conectando operaciones, liderazgo, servicio, tecnología y rendimiento.',
'Metodología':'Analizar → Diseñar → Ejecutar → Medir → Mejorar. Una metodología aplicada a operaciones, proyectos, sistemas y rendimiento.',
'Proyectos':'Chetesaí Fitness+, Portfolio IT, OpoStudy, Farmagend y proyectos de Hospitality.',
'Contacto':'Este portfolio conecta mis tres áreas profesionales. Puedes acceder a mis portfolios especializados desde los proyectos inferiores.',
'Hostelería':'F&B, eventos, banquetes, operaciones, logística, equipos, costes, KPI y experiencia del cliente.',
'KPIs':'RevPAR F&B, coste de alimentos, satisfacción del cliente, productividad de equipo y control operativo.',
'Rendimiento':'Planificación, seguimiento y mejora continua de resultados operativos.',
'Tecnología':'Sistemas, desarrollo, redes, seguridad, IA, datos y automatización.',
'Proyectos destacados':'Portfolio IT, OpoStudy, Farmagend y automatización.',
'Deporte':'Entrenamiento, nutrición, sueño, recuperación, movimiento, energía, estrés y rendimiento sostenible.',
'La conexión':'Personas · Procesos · Resultados. La unión entre los tres mundos profesionales.',
'OpoStudy':'Plataforma de preparación TAI con tests, simuladores, prácticos, estadísticas y contenidos.',
'Farmagend 24/7':'Centro híbrido físico-digital con automatización, dispensación 24/7, e-commerce e inteligencia aplicada.'
};
document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{const k=el.dataset.open;title.textContent=k;body.textContent=copy[k]||'Área integrada dentro de mi visión profesional.';modal.showModal()}));
document.querySelector('.close').addEventListener('click',()=>modal.close());
modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});
</script>
