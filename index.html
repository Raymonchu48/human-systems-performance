<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramón A. Curbalán Vega | Human · Systems · Performance</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden}
.cluster-stage{position:relative;width:min(100vw,1672px);aspect-ratio:1672/941;margin:0 auto;background:#000;overflow:hidden}
.cluster-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;border:0;background:transparent;color:transparent;cursor:pointer;z-index:5;padding:0}
.hotspot:focus-visible{outline:2px solid #fff;outline-offset:-2px}
dialog{width:min(560px,92vw);border:1px solid rgba(255,255,255,.18);border-radius:18px;background:#071722;color:#fff;padding:28px;box-shadow:0 30px 100px rgba(0,0,0,.75)}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}
dialog button.close{position:absolute;right:12px;top:8px;border:0;background:none;color:#fff;font-size:28px;cursor:pointer}
dialog small{color:#ffd76b;font-weight:700;letter-spacing:.12em}
dialog h2{margin:8px 0 10px;font-size:28px}
dialog p{margin:0;color:#c9d6dc;line-height:1.65}

/* Fases interactivas de Hostelería */
.host-step{
  position:absolute;z-index:8;border:1px solid transparent;border-radius:10px;
  background:rgba(224,183,73,0);cursor:pointer;padding:0;
  transition:background .22s ease,box-shadow .22s ease,border-color .22s ease,transform .22s ease;
}
.host-step:hover,.host-step:focus-visible,.host-step.active{
  background:rgba(224,183,73,.12);
  border-color:rgba(255,218,112,.42);
  box-shadow:inset 0 0 18px rgba(255,205,73,.16),0 0 14px rgba(255,190,55,.18);
  outline:none;
}
.host-step:hover{transform:translateX(2px)}
.host-detail{
  position:absolute;left:13.2%;top:18.5%;width:27.5%;min-height:21.8%;z-index:12;
  padding:19px 22px 18px 24px;border:1px solid rgba(232,190,77,.72);border-radius:18px;
  background:linear-gradient(135deg,rgba(5,16,22,.96),rgba(12,27,34,.94));
  color:#fff;box-shadow:0 24px 70px rgba(0,0,0,.48),0 0 28px rgba(224,183,73,.12);
  backdrop-filter:blur(8px);
  opacity:0;transform:translateX(-22px) scale(.985);pointer-events:none;
  transition:opacity .28s ease,transform .28s cubic-bezier(.2,.75,.25,1);
}
.host-detail.open{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
.host-detail::before{
  content:"";position:absolute;left:-18px;top:38px;width:18px;height:2px;
  background:linear-gradient(90deg,rgba(224,183,73,0),rgba(224,183,73,.9));
}
.host-detail .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#e0b749;margin-bottom:6px}
.host-detail h3{margin:0 34px 8px 0;font-size:clamp(18px,1.55vw,28px);line-height:1.05}
.host-detail p{margin:0 0 10px;color:#cbd7dc;font-size:clamp(11px,.82vw,15px);line-height:1.45}
.host-detail ul{margin:8px 0 0;padding-left:18px;color:#edf3f5;font-size:clamp(10px,.76vw,14px);line-height:1.42}
.host-detail li{margin:4px 0}
.host-detail .host-tag{
  margin-top:12px;padding-top:10px;border-top:1px solid rgba(224,183,73,.2);
  color:#f2cf70;font-size:clamp(9px,.68vw,12px);font-weight:700;letter-spacing:.03em
}
.host-detail .host-close{
  position:absolute;right:10px;top:8px;border:0;background:transparent;color:#fff;
  font-size:24px;line-height:1;cursor:pointer;opacity:.72
}
.host-detail .host-close:hover{opacity:1;color:#f2cf70}

@media(max-width:760px){
 .cluster-stage{width:100vw;min-width:0}
 .host-detail{left:13%;top:17.5%;width:38%;padding:11px 12px;min-height:24%}
 .host-detail h3{font-size:14px}.host-detail p,.host-detail ul{font-size:9px}
}
</style>
</head>
<body>
<main class="cluster-stage" id="cluster">
<img src="assets/cluster-approved.webp?v=no-social-hablemos" alt="Cluster Human Systems Performance de Ramón A. Curbalán Vega">

<!-- navegación -->
<button class="hotspot" style="left:28.4%;top:0;width:5.3%;height:6.8%" data-open="Inicio" aria-label="Inicio"></button>
<a class="hotspot" style="left:34.1%;top:0;width:6%;height:6.8%" href="perfil.html" aria-label="Mi perfil"></a>
<a class="hotspot" style="left:40.2%;top:0;width:6.4%;height:6.8%" href="experiencia.html" aria-label="Experiencia"></a>
<a class="hotspot" style="left:47%;top:0;width:6.6%;height:6.8%" href="metodologia.html" aria-label="Metodología"></a>
<button class="hotspot" style="left:54%;top:0;width:6.5%;height:6.8%" data-open="Proyectos" aria-label="Proyectos"></button>
<a class="hotspot" style="left:60.8%;top:0;width:6.4%;height:6.8%" href="contacto.html" aria-label="Contacto"></a>

<!-- nodos centrales -->
<a class="hotspot" style="left:33.5%;top:25.2%;width:7.4%;height:11.5%" href="https://raymonchu48.github.io/Portfolio_Hosteleria/" aria-label="F&B"></a>
<a class="hotspot" style="left:57.8%;top:25.2%;width:7%;height:11.5%" href="https://raymonchu48.github.io/Portfolio/" aria-label="IT"></a>
<a class="hotspot" style="left:44.5%;top:46.4%;width:8.4%;height:13%" href="https://raymonchu48.github.io/Deportivo/" aria-label="Sport"></a>

<!-- hostelería -->
<button class="host-step" style="left:2.25%;top:19.15%;width:9.7%;height:4.15%" data-host-step="planificacion" aria-label="Planificación en hostelería"></button>
<button class="host-step" style="left:2.25%;top:23.35%;width:9.7%;height:4.15%" data-host-step="recursos" aria-label="Recursos en hostelería"></button>
<button class="host-step" style="left:2.25%;top:27.55%;width:9.7%;height:4.15%" data-host-step="ejecucion" aria-label="Ejecución en hostelería"></button>
<button class="host-step" style="left:2.25%;top:31.75%;width:9.7%;height:4.15%" data-host-step="monitoreo" aria-label="Monitoreo en hostelería"></button>
<button class="host-step" style="left:2.25%;top:35.95%;width:9.7%;height:4.15%" data-host-step="cierre" aria-label="Cierre en hostelería"></button>

<aside class="host-detail" id="hostDetail" aria-live="polite" aria-hidden="true">
  <button class="host-close" id="hostClose" aria-label="Cerrar detalle">×</button>
  <div class="eyebrow" id="hostEyebrow">HOSTELERÍA · F&B · EVENTOS</div>
  <h3 id="hostTitle"></h3>
  <p id="hostIntro"></p>
  <ul id="hostList"></ul>
  <div class="host-tag" id="hostTag"></div>
</aside>
<button class="hotspot" style="left:1.4%;top:40.3%;width:15.1%;height:17.4%" data-open="KPIs" aria-label="KPIs de hostelería"></button>
<!-- tecnología -->
<button class="hotspot" style="left:88.7%;top:8.8%;width:9.6%;height:27%" data-open="Tecnología" aria-label="Áreas de tecnología"></button>
<!-- deporte -->
<button class="hotspot" style="left:22%;top:54%;width:61%;height:35%" data-open="Deporte" aria-label="Rendimiento deportivo"></button>

<!-- metodología / conexión -->
<a class="hotspot" style="left:84.5%;top:55.7%;width:13.8%;height:21.5%" href="metodologia.html" aria-label="Mi metodología"></a>
<button class="hotspot" style="left:84.5%;top:77.4%;width:13.8%;height:11.6%" data-open="La conexión" aria-label="La conexión"></button>

<!-- proyectos inferiores -->
<a class="hotspot" style="left:11.5%;top:90.2%;width:22%;height:8%" href="https://chetesaifitness.com/" target="_blank" rel="noreferrer" aria-label="Chetesaí Fitness+"></a>
<a class="hotspot" style="left:33.5%;top:90.2%;width:24%;height:8%" href="https://raymonchu48.github.io/Test-de-Oposicion-TAI/" aria-label="OpoStudy"></a>
<a class="hotspot" style="left:58%;top:90.2%;width:20.5%;height:8%" href="farmagend.html" aria-label="Farmagend 24/7"></a>
<a class="hotspot" style="left:78.5%;top:90.2%;width:19.2%;height:8%" href="https://raymonchu48.github.io/App_Inventarios/" aria-label="Banquete Fácil"></a>
</main>

<dialog id="modal">
<button class="close" aria-label="Cerrar">×</button>
<small>HUMAN · SYSTEMS · PERFORMANCE</small>
<h2 id="modalTitle"></h2>
<p id="modalBody"></p>
</dialog>

<script>
const modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),body=document.getElementById('modalBody');

const hostData={
 planificacion:{
  title:'Planificación',
  intro:'Convierto cada servicio o evento en un plan operativo claro antes de que empiece.',
  bullets:[
   'Defino objetivo, BEO, layout, cronograma, volúmenes, timings y puntos críticos.',
   'Coordino cocina, sala, eventos, recepción y proveedores desde una única secuencia de trabajo.',
   'Anticipo picos de demanda, riesgos, necesidades de personal y contingencias.'
  ],
  tag:'Resultado: operación preparada, tiempos controlados y menos improvisación.'
 },
 recursos:{
  title:'Recursos',
  intro:'Dimensiono personas, material y espacios según la demanda real del servicio.',
  bullets:[
   'Staffing por picos, funciones y ratios; briefing de responsabilidades antes de abrir.',
   'Menaje, estaciones, barras, compras, inventario, reposiciones y circuitos BOH.',
   'Asignación flexible de recursos para reforzar el punto exacto donde se genera presión operativa.'
  ],
  tag:'Resultado: el recurso correcto, en el lugar correcto y en el momento correcto.'
 },
 ejecucion:{
  title:'Ejecución',
  intro:'Transformo el plan en una secuencia de servicio coordinada y visible para todo el equipo.',
  bullets:[
   'Briefing operativo, reparto de roles y secuencia de servicio minuto a minuto.',
   'Coordinación cocina–sala–eventos–recepción con estándares 5★ / 5★ GL.',
   'Presencia activa en operación, resolución de incidencias y adaptación sin perder el estándar.'
  ],
  tag:'Resultado: fluidez, consistencia y experiencia de cliente.'
 },
 monitoreo:{
  title:'Monitoreo',
  intro:'Superviso el servicio en tiempo real para detectar desviaciones antes de que afecten al cliente.',
  bullets:[
   'Control de tiempos, calidad, flujos, satisfacción, consumos e incidencias.',
   'Lectura continua de carga de trabajo y redistribución de personal cuando cambia la demanda.',
   'Seguimiento de KPI operativos y comunicación directa con responsables de cada área.'
  ],
  tag:'Resultado: decisiones rápidas basadas en operación real, no en suposiciones.'
 },
 cierre:{
  title:'Cierre',
  intro:'El servicio no termina cuando sale el último cliente: cierro el ciclo operativo y económico.',
  bullets:[
   'Revisión de consumos, inventarios, incidencias, costes y desviaciones.',
   'Valoración de satisfacción, productividad, rentabilidad y cumplimiento del estándar.',
   'Debrief con el equipo y registro de aprendizajes para mejorar el siguiente servicio o evento.'
  ],
  tag:'Resultado: control, aprendizaje y mejora continua.'
 }
};
const hostPanel=document.getElementById('hostDetail');
const hostTitle=document.getElementById('hostTitle');
const hostIntro=document.getElementById('hostIntro');
const hostList=document.getElementById('hostList');
const hostTag=document.getElementById('hostTag');
const hostButtons=[...document.querySelectorAll('[data-host-step]')];
function closeHostDetail(){
 hostPanel.classList.remove('open');hostPanel.setAttribute('aria-hidden','true');
 hostButtons.forEach(b=>b.classList.remove('active'));
}
hostButtons.forEach(btn=>btn.addEventListener('click',e=>{
 e.stopPropagation();
 const key=btn.dataset.hostStep,d=hostData[key];
 hostButtons.forEach(b=>b.classList.toggle('active',b===btn));
 hostTitle.textContent=d.title;hostIntro.textContent=d.intro;
 hostList.innerHTML=d.bullets.map(x=>'<li>'+x+'</li>').join('');
 hostTag.textContent=d.tag;
 hostPanel.classList.add('open');hostPanel.setAttribute('aria-hidden','false');
}));
document.getElementById('hostClose').addEventListener('click',e=>{e.stopPropagation();closeHostDetail()});
document.addEventListener('click',e=>{
 if(hostPanel.classList.contains('open') && !hostPanel.contains(e.target) && !e.target.closest('[data-host-step]')) closeHostDetail();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeHostDetail()});

const copy={
'Inicio':'Tres disciplinas. Una misma forma de pensar: personas, procesos, tecnología y rendimiento.',
'Mi perfil':'Perfil multidisciplinar que integra dirección de F&B y eventos, sistemas y transformación digital, entrenamiento, nutrición y gestión de proyectos.',
'Experiencia':'Más de dos décadas de experiencia profesional conectando operaciones, liderazgo, servicio, tecnología y rendimiento.',
'Metodología':'Analizar → Diseñar → Ejecutar → Medir → Mejorar. Una metodología aplicada a operaciones, proyectos, sistemas y rendimiento.',
'Proyectos':'Chetesaí Fitness+, Portfolio IT, OpoStudy, Farmagend y proyectos de Hospitality.',
'Contacto':'Este portfolio conecta mis tres áreas profesionales. Puedes acceder a mis portfolios especializados desde los proyectos inferiores.',
'Hostelería':'F&B, eventos, banquetes, operaciones, logística, equipos, costes, KPI y experiencia del cliente.',
'KPIs':'RevPAR F&B, coste de alimentos, satisfacción del cliente, productividad de equipo y control operativo.',
'Rendimiento':'Planificación, seguimiento y mejora continua de resultados operativos.',
'Tecnología':'Sistemas, desarrollo, redes, seguridad, IA, datos y automatización.',
'Proyectos destacados':'Portfolio IT, OpoStudy, Farmagend y automatización.',
'Deporte':'Entrenamiento, nutrición, sueño, recuperación, movimiento, energía, estrés y rendimiento sostenible.',
'La conexión':'Personas · Procesos · Resultados. La unión entre los tres mundos profesionales.',
'OpoStudy':'Plataforma de preparación TAI con tests, simuladores, prácticos, estadísticas y contenidos.',
'Farmagend 24/7':'Centro híbrido físico-digital con automatización, dispensación 24/7, e-commerce e inteligencia aplicada.'
};
document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{const k=el.dataset.open;title.textContent=k;body.textContent=copy[k]||'Área integrada dentro de mi visión profesional.';modal.showModal()}));
document.querySelector('.close').addEventListener('click',()=>modal.close());
modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});
</script>
</body>
</html>
