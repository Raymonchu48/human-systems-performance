<style>
*{box-sizing:border-box}
:root{
  --bg:#03070b;--panel:rgba(7,18,27,.88);--ink:#f2f5f7;--mut:#9eb0bc;
  --gold:#e2b84f;--cyan:#3cb4e1;--green:#54c277;--line:rgba(255,255,255,.09);
  --serif:"Fraunces",Georgia,serif;--sans:"Inter",Arial,sans-serif;
}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{overflow-x:hidden}
.cluster-stage{position:relative;width:min(100vw,1672px);aspect-ratio:1672/941;margin:0 auto;background:#000;overflow:hidden;isolation:isolate}
.cluster-master-svg{
  position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;
  pointer-events:none;user-select:none;
  filter:saturate(.96) contrast(1) brightness(1);
}
.cluster-stage::before{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(2,7,11,.05) 0%,rgba(2,7,11,.00) 18%,rgba(2,7,11,.00) 72%,rgba(2,7,11,.06) 100%),
    radial-gradient(120% 100% at 50% 50%,transparent 72%,rgba(0,0,0,.12) 100%);
}
.cluster-stage::after{
  content:"";position:absolute;left:0;right:0;top:0;height:7.2%;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,10,16,.06),rgba(3,10,16,.02) 72%,transparent);
  border-bottom:1px solid rgba(255,255,255,.035);
  backdrop-filter:none;
}
.hotspot{position:absolute;border:0;background:transparent;color:transparent;cursor:pointer;z-index:5;padding:0}
.hotspot:focus-visible{outline:1px solid rgba(255,255,255,.8);outline-offset:-2px}
dialog{width:min(560px,92vw);border:1px solid rgba(255,255,255,.18);border-radius:18px;background:#071722;color:#fff;padding:28px;box-shadow:0 30px 100px rgba(0,0,0,.75)}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}
dialog button.close{position:absolute;right:12px;top:8px;border:0;background:none;color:#fff;font-size:28px;cursor:pointer}
dialog small{color:#ffd76b;font-weight:700;letter-spacing:.12em}
dialog h2{margin:8px 0 10px;font-size:28px}
dialog p{margin:0;color:#c9d6dc;line-height:1.65}


/* --- Premium interaction layer --- */
.nav-hotspot{
  border-radius:10px;transition:background .25s ease,box-shadow .25s ease;
}
.nav-hotspot::after{
  content:"";position:absolute;left:22%;right:22%;bottom:4px;height:1.5px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:0;transform:scaleX(.45);transition:opacity .25s ease,transform .25s ease;
}
.nav-hotspot:hover{background:rgba(255,255,255,.025)}
.nav-hotspot:hover::after,.nav-hotspot:focus-visible::after{opacity:.9;transform:scaleX(1)}

.node-hotspot{border-radius:50%;transition:transform .28s ease,filter .28s ease}
.node-hotspot::after{
  content:"";position:absolute;inset:8%;border-radius:50%;border:1px solid currentColor;
  opacity:0;transform:scale(.92);transition:opacity .28s ease,transform .28s ease,box-shadow .28s ease;
}
.node-hotspot::before{
  content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);
  transform:translateX(-50%) translateY(5px);opacity:0;pointer-events:none;white-space:nowrap;
  color:#eef4f7;background:rgba(7,18,27,.94);border:1px solid var(--line);border-radius:999px;
  padding:7px 11px;font:600 clamp(8px,.64vw,11px) var(--sans);letter-spacing:.07em;
  box-shadow:0 12px 30px rgba(0,0,0,.35);transition:.25s;
}
.node-hotspot:hover{transform:scale(1.025)}
.node-hotspot:hover::before,.node-hotspot:focus-visible::before{opacity:1;transform:translateX(-50%) translateY(0)}
.node-hotspot:hover::after,.node-hotspot:focus-visible::after{opacity:.75;transform:scale(1)}
.node-host{color:rgba(226,184,79,.72)}
.node-tech{color:rgba(60,180,225,.72)}
.node-sport{color:rgba(84,194,119,.78)}
.node-host:hover::after{box-shadow:0 0 16px rgba(226,184,79,.20)}
.node-tech:hover::after{box-shadow:0 0 16px rgba(60,180,225,.20)}
.node-sport:hover::after{box-shadow:0 0 16px rgba(84,194,119,.20)}

.project-hotspot{
  border-radius:13px;border:1px solid transparent;transition:background .25s ease,border-color .25s ease,transform .25s ease,box-shadow .25s ease;
}
.project-hotspot:hover,.project-hotspot:focus-visible{
  transform:translateY(-2px);background:rgba(255,255,255,.025);
  border-color:rgba(255,255,255,.14);box-shadow:0 12px 26px rgba(0,0,0,.18);
}

/* Tecnología: filas interactivas */
.tech-step{
  position:absolute;z-index:8;border:1px solid transparent;border-radius:9px;
  background:rgba(60,180,225,0);cursor:pointer;padding:0;
  transition:background .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.tech-step:hover,.tech-step:focus-visible,.tech-step.active{
  background:rgba(60,180,225,.06);border-color:rgba(91,205,242,.24);
  box-shadow:inset 0 0 10px rgba(60,180,225,.10),0 0 8px rgba(60,180,225,.08);outline:none;
}
.tech-detail{
  position:absolute;left:65.3%;top:9.2%;width:21.8%;min-height:24%;z-index:12;
  padding:19px 22px;border:1px solid rgba(60,180,225,.58);border-radius:18px;
  background:linear-gradient(135deg,rgba(5,16,24,.96),rgba(8,27,38,.93));
  box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 24px rgba(60,180,225,.08);
  backdrop-filter:blur(9px);opacity:0;transform:translateX(20px) scale(.985);pointer-events:none;
  transition:opacity .28s ease,transform .28s cubic-bezier(.2,.75,.25,1);
}
.tech-detail.open{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
.tech-detail::after{
  content:"";position:absolute;right:-18px;top:38px;width:18px;height:2px;
  background:linear-gradient(90deg,rgba(60,180,225,.9),rgba(60,180,225,0));
}
.tech-detail .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--cyan);margin-bottom:6px}
.tech-detail h3{margin:0 34px 8px 0;font-family:var(--serif);font-size:clamp(18px,1.45vw,27px);line-height:1.05}
.tech-detail p{margin:0 0 10px;color:#cbd7dc;font-size:clamp(11px,.82vw,15px);line-height:1.45}
.tech-detail ul{margin:8px 0 0;padding-left:18px;color:#edf3f5;font-size:clamp(10px,.75vw,14px);line-height:1.42}
.tech-detail li{margin:4px 0}
.tech-detail .tech-tag{margin-top:12px;padding-top:10px;border-top:1px solid rgba(60,180,225,.18);color:#8fdcf6;font-size:clamp(9px,.67vw,12px);font-weight:700}
.tech-detail .tech-close{position:absolute;right:10px;top:8px;border:0;background:transparent;color:#fff;font-size:24px;line-height:1;cursor:pointer;opacity:.7}
.tech-detail .tech-close:hover{opacity:1;color:#8fdcf6}

/* Diálogos menos artificiales */
dialog{
  font-family:var(--sans);background:linear-gradient(160deg,rgba(7,18,27,.98),rgba(10,24,36,.96));
  border:1px solid rgba(255,255,255,.11);box-shadow:0 28px 90px rgba(0,0,0,.58);
}
dialog h2{font-family:var(--serif);font-weight:700}



/* --- Tecnología integrada limpiamente dentro de la geometría del clúster --- */
.tech-zone{
  position:absolute;left:63.45%;top:7.75%;width:36.55%;height:46.9%;z-index:1;
  overflow:hidden;color:#eef9fc;background-color:#06131b;
  /*
    El retrato forma parte del fondo del propio módulo, no es una capa pegada.
    Se desplaza a la izquierda para reservar una columna limpia a la navegación.
  */
  background-image:
    linear-gradient(90deg,
      rgba(3,17,27,.18) 0%,
      rgba(3,17,27,.06) 42%,
      rgba(3,17,27,.20) 60%,
      rgba(3,17,27,.82) 76%,
      rgba(3,17,27,.97) 100%),
    linear-gradient(180deg,rgba(3,15,24,.02) 0%,rgba(3,15,24,.08) 66%,rgba(3,15,24,.50) 100%),
    url("assets/it-profile.jpg");
  background-repeat:no-repeat;
  background-size:100% 100%,100% 100%,118% auto;
  background-position:center,center,43% 47%;
}
.tech-zone::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(66% 82% at 39% 48%,rgba(34,154,205,.10),transparent 74%),
    linear-gradient(90deg,rgba(2,11,18,.10),transparent 22%,transparent 58%,rgba(2,12,20,.24) 72%,rgba(2,12,20,.56) 100%);
}
.tech-zone::after{
  content:"";position:absolute;right:0;top:0;bottom:0;width:30%;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,rgba(3,17,27,0),rgba(3,17,27,.68) 26%,rgba(3,17,27,.92) 100%);
}
.tech-copy{
  position:absolute;left:5.4%;top:4.5%;z-index:4;width:56%;
  text-shadow:0 2px 12px rgba(0,0,0,.62);
}
.tech-copy .kicker{font-size:clamp(8px,.70vw,12px);letter-spacing:.12em;color:#a8deec;font-weight:600}
.tech-copy h2{
  margin:.22em 0 .08em;font-family:var(--sans);font-size:clamp(23px,2.18vw,40px);
  line-height:.92;letter-spacing:.012em;color:#45d3ff;font-weight:800
}
.tech-copy p{margin:0;font-size:clamp(9px,.82vw,15px);letter-spacing:.035em;color:#91daec;font-weight:600}

.tech-rail{
  position:absolute;right:1.7%;top:7.8%;width:28.2%;z-index:5;
  display:flex;flex-direction:column;gap:7px;padding:0
}
.tech-zone .tech-step{
  position:relative!important;left:auto!important;top:auto!important;width:100%!important;height:41px!important;
  display:flex;align-items:center;gap:10px;padding:6px 11px!important;
  border:1px solid rgba(71,211,255,.66);border-radius:12px;
  background:linear-gradient(180deg,rgba(4,24,35,.94),rgba(3,17,27,.96));
  color:#f6fbfd;cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,.16);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease
}
.tech-zone .tech-step:hover,.tech-zone .tech-step:focus-visible,.tech-zone .tech-step.active{
  transform:translateX(-2px);background:rgba(5,30,43,.99);
  border-color:#6de1ff;box-shadow:0 0 14px rgba(61,210,255,.16),inset 0 0 14px rgba(61,210,255,.06)
}
.tech-zone .tech-step svg{
  width:21px;height:21px;flex:0 0 21px;stroke:#43d9ff;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round
}
.tech-zone .tech-step span{
  font:700 clamp(9px,.72vw,13px) var(--sans);letter-spacing:.012em;color:#f2f8fa;text-align:left
}

/* Conector alineado con la columna de tarjetas; no atraviesa el retrato */
.tech-connector{
  position:absolute;right:31.25%;top:10.5%;height:61.5%;width:1px;z-index:4;
  background:linear-gradient(180deg,rgba(74,219,255,.18),rgba(74,219,255,.82) 10% 90%,rgba(74,219,255,.18))
}
.tech-connector i{
  position:absolute;left:50%;width:8px;height:8px;border-radius:50%;
  background:#adf1ff;border:1px solid #52dcff;transform:translate(-50%,-50%);
  box-shadow:0 0 10px rgba(82,220,255,.46)
}
.tech-connector i:nth-child(1){top:4%}.tech-connector i:nth-child(2){top:22.5%}
.tech-connector i:nth-child(3){top:41%}.tech-connector i:nth-child(4){top:59.5%}
.tech-connector i:nth-child(5){top:78%}.tech-connector i:nth-child(6){top:96%}

.tech-quote{
  position:absolute;right:1.7%;bottom:3.6%;width:45.5%;z-index:5;padding:10px 13px 10px 22px;
  border:1px solid rgba(59,193,235,.58);border-radius:13px;
  background:linear-gradient(90deg,rgba(4,23,34,.94),rgba(4,18,28,.96));
  box-shadow:0 10px 24px rgba(0,0,0,.18)
}
.tech-quote::before{
  content:"";position:absolute;left:10px;top:12px;bottom:12px;width:3px;background:#42d7ff;border-radius:3px
}
.tech-quote p{margin:0;font-size:clamp(9px,.70vw,12.5px);line-height:1.34;color:#eef7fa}
.tech-quote strong{display:block;color:#45d9ff;margin-top:2px;font-weight:700}

@media(max-width:760px){
  .tech-zone{
    background-size:100% 100%,100% 100%,120% auto;
    background-position:center,center,39% 47%;
  }
  .tech-zone::after{width:32%}
  .tech-copy{width:54%}
  .tech-copy h2{font-size:18px}
  .tech-copy .kicker,.tech-copy p{font-size:7px}
  .tech-rail{right:1.3%;width:29.5%;gap:3px}
  .tech-zone .tech-step{height:27px!important;padding:3px 6px!important;gap:5px;border-radius:8px}
  .tech-zone .tech-step svg{width:14px;height:14px;flex-basis:14px}
  .tech-zone .tech-step span{font-size:7px}
  .tech-connector{right:32.2%}
  .tech-quote{right:1.3%;width:47%;padding:6px 7px 6px 15px}
  .tech-quote p{font-size:6.5px}
}

/* Metodología + La Conexión: interacción integrada */
.method-step,.connection-step{
  position:absolute;z-index:8;border:1px solid transparent;border-radius:9px;
  background:rgba(226,184,79,0);cursor:pointer;padding:0;
  transition:background .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.method-step:hover,.method-step:focus-visible,.method-step.active,
.connection-step:hover,.connection-step:focus-visible,.connection-step.active{
  background:rgba(226,184,79,.065);
  border-color:rgba(240,201,91,.25);
  box-shadow:inset 0 0 10px rgba(226,184,79,.10),0 0 8px rgba(226,184,79,.08);
  outline:none;
}
.method-detail{
  position:absolute;left:62.7%;top:57.2%;width:20.8%;min-height:23%;z-index:14;
  padding:18px 21px 17px 23px;border:1px solid rgba(226,184,79,.54);border-radius:17px;
  background:linear-gradient(145deg,rgba(5,15,21,.97),rgba(10,24,31,.95));
  color:#fff;box-shadow:0 22px 62px rgba(0,0,0,.44),0 0 20px rgba(226,184,79,.07);
  backdrop-filter:blur(7px);
  opacity:0;transform:translateX(18px) scale(.988);pointer-events:none;
  transition:opacity .27s ease,transform .27s cubic-bezier(.2,.75,.25,1);
}
.method-detail.open{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
.method-detail::after{
  content:"";position:absolute;right:-18px;top:38px;width:18px;height:1px;
  background:linear-gradient(90deg,rgba(226,184,79,.85),rgba(226,184,79,0));
}
.method-detail .eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.15em;color:var(--gold);margin-bottom:6px
}
.method-detail h3{
  margin:0 34px 8px 0;font-family:var(--serif);font-size:clamp(18px,1.42vw,27px);line-height:1.06
}
.method-detail p{
  margin:0 0 10px;color:#cbd7dc;font-size:clamp(11px,.81vw,15px);line-height:1.45
}
.method-detail ul{
  margin:7px 0 0;padding-left:18px;color:#eef3f5;font-size:clamp(10px,.74vw,14px);line-height:1.42
}
.method-detail li{margin:4px 0}
.method-detail .method-tag{
  margin-top:11px;padding-top:9px;border-top:1px solid rgba(226,184,79,.17);
  color:#f0cd72;font-size:clamp(9px,.67vw,12px);font-weight:700
}
.method-detail .method-close{
  position:absolute;right:10px;top:8px;border:0;background:transparent;color:#fff;
  font-size:24px;line-height:1;cursor:pointer;opacity:.7
}
.method-detail .method-close:hover{opacity:1;color:#f0cd72}

/* Fases interactivas de Hostelería */
.host-step{
  position:absolute;z-index:8;border:1px solid transparent;border-radius:10px;
  background:rgba(224,183,73,0);cursor:pointer;padding:0;
  transition:background .22s ease,box-shadow .22s ease,border-color .22s ease,transform .22s ease;
}
.host-step:hover,.host-step:focus-visible,.host-step.active{
  background:rgba(224,183,73,.075);
  border-color:rgba(255,218,112,.28);
  box-shadow:inset 0 0 12px rgba(255,205,73,.10),0 0 9px rgba(255,190,55,.10);
  outline:none;
}
.host-step:hover{transform:translateX(2px)}
.host-detail{
  position:absolute;left:13.2%;top:18.5%;width:27.5%;min-height:21.8%;z-index:12;
  padding:19px 22px 18px 24px;border:1px solid rgba(232,190,77,.72);border-radius:18px;
  background:linear-gradient(135deg,rgba(5,16,22,.96),rgba(12,27,34,.94));
  color:#fff;box-shadow:0 24px 70px rgba(0,0,0,.48),0 0 28px rgba(224,183,73,.12);
  backdrop-filter:blur(8px);
  opacity:0;transform:translateX(-22px) scale(.985);pointer-events:none;
  transition:opacity .28s ease,transform .28s cubic-bezier(.2,.75,.25,1);
}
.host-detail.open{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
.host-detail::before{
  content:"";position:absolute;left:-18px;top:38px;width:18px;height:2px;
  background:linear-gradient(90deg,rgba(224,183,73,0),rgba(224,183,73,.9));
}
.host-detail .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#e0b749;margin-bottom:6px}
.host-detail h3{margin:0 34px 8px 0;font-family:var(--serif);font-size:clamp(18px,1.55vw,28px);line-height:1.05}
.host-detail p{margin:0 0 10px;color:#cbd7dc;font-size:clamp(11px,.82vw,15px);line-height:1.45}
.host-detail ul{margin:8px 0 0;padding-left:18px;color:#edf3f5;font-size:clamp(10px,.76vw,14px);line-height:1.42}
.host-detail li{margin:4px 0}
.host-detail .host-tag{
  margin-top:12px;padding-top:10px;border-top:1px solid rgba(224,183,73,.2);
  color:#f2cf70;font-size:clamp(9px,.68vw,12px);font-weight:700;letter-spacing:.03em
}
.host-detail .host-close{
  position:absolute;right:10px;top:8px;border:0;background:transparent;color:#fff;
  font-size:24px;line-height:1;cursor:pointer;opacity:.72
}
.host-detail .host-close:hover{opacity:1;color:#f2cf70}

@media(max-width:760px){
 .cluster-stage{width:100vw;min-width:0}
 .host-detail{left:13%;top:17.5%;width:38%;padding:11px 12px;min-height:24%}
 .host-detail h3{font-size:14px}.host-detail p,.host-detail ul{font-size:9px}
 .tech-detail{left:59%;top:8.5%;width:28%;padding:11px 12px}
 .tech-detail h3{font-size:14px}.tech-detail p,.tech-detail ul{font-size:9px}
 .method-detail{left:54%;top:56%;width:29%;padding:11px 12px}
 .method-detail h3{font-size:14px}.method-detail p,.method-detail ul{font-size:9px}
}
</style>
