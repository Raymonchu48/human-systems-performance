let current=1;const total=9;const slide=document.getElementById('slide'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');function show(n){current=Math.max(1,Math.min(total,n));slide.src='assets/perfil/Diapositiva'+current+'.PNG';slide.alt='Perfil profesional integral — diapositiva '+current+' de '+total;count.textContent=current+' / '+total;prev.disabled=current===1;next.disabled=current===total}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});</script></body></html>
