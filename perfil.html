<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Perfil | Ramón A. Curbalán Vega</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#06131c;font-family:Arial,sans-serif;color:#fff}
body{display:flex;flex-direction:column;overflow:hidden}
.toolbar{
  min-height:68px;display:flex;align-items:center;gap:16px;padding:10px clamp(12px,3vw,32px);
  background:#071822;border-bottom:1px solid rgba(255,215,107,.32);
  box-shadow:0 8px 28px rgba(0,0,0,.38);z-index:10
}
.back{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#071018;
  background:#e2b84f;border:1px solid #f3d87d;border-radius:999px;padding:11px 18px;
  font-weight:800;white-space:nowrap
}
.back:hover{filter:brightness(1.08)}
.identity{min-width:0;line-height:1.15}
.identity strong{display:block;font-size:clamp(14px,2vw,20px);letter-spacing:.03em}
.identity span{display:block;color:#a9bdc9;font-size:12px;margin-top:4px;letter-spacing:.08em}
.actions{margin-left:auto;display:flex;gap:10px}
.open{
  color:#d9eef8;text-decoration:none;border:1px solid rgba(78,203,241,.55);
  border-radius:999px;padding:10px 14px;font-size:13px;white-space:nowrap
}
.viewer{position:relative;flex:1;min-height:0;background:#111}
.viewer iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.fallback{display:none}
@media(max-width:620px){
  .toolbar{min-height:60px;padding:8px 10px}
  .identity span{display:none}
  .back{padding:10px 13px;font-size:13px}
  .open{padding:9px 10px;font-size:12px}
}
</style>
</head>
<body>
<header class="toolbar">
  <a class="back" href="./" aria-label="Volver al cluster">← Volver al cluster</a>
  <div class="identity">
    <strong>RAMÓN A. CURBALÁN VEGA</strong>
    <span>PERFIL PROFESIONAL INTEGRAL · HUMAN · SYSTEMS · PERFORMANCE</span>
  </div>
  <div class="actions">
    <a class="open" href="assets/Perfil_Profesional_Integral_Ramon_Curbalan.pdf" target="_blank" rel="noopener">Abrir PDF</a>
  </div>
</header>
<main class="viewer">
  <iframe
    src="assets/Perfil_Profesional_Integral_Ramon_Curbalan.pdf#view=FitH"
    title="Perfil profesional integral de Ramón A. Curbalán Vega">
  </iframe>
</main>
</body>
</html>
