<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FARMAGEND 24/7 | Dossier para inversores</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#06131c;color:#fff}body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#0d3441 0,#06131c 45%,#03090d 100%)}
.toolbar{min-height:70px;display:flex;align-items:center;gap:18px;padding:10px clamp(12px,3vw,34px);background:rgba(4,18,27,.94);border-bottom:1px solid rgba(65,213,209,.35);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.back,.open{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:999px;padding:11px 18px;font-weight:800;white-space:nowrap;cursor:pointer}.back{color:#081218;background:#d9b54a;border:1px solid #f1d06b}.open{margin-left:auto;color:#e9feff;background:#0d7984;border:1px solid #35d0d1}.open[aria-disabled="true"]{opacity:.45;pointer-events:none}.identity{min-width:0}.identity strong{display:block;font-size:clamp(16px,2vw,21px);letter-spacing:.04em}.identity span{display:block;margin-top:4px;color:#8fb9c4;font-size:12px;letter-spacing:.08em}
main{flex:1;display:grid;place-items:center;padding:28px}.card{width:min(820px,94vw);padding:clamp(28px,5vw,56px);border:1px solid rgba(65,213,209,.28);border-radius:28px;background:linear-gradient(145deg,rgba(8,34,44,.92),rgba(5,19,28,.96));box-shadow:0 30px 100px rgba(0,0,0,.4);text-align:center}.mark{width:86px;height:86px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;font-size:40px;background:linear-gradient(145deg,#14b9ba,#087c89);box-shadow:0 0 45px rgba(30,211,205,.28)}h1{margin:0;font-size:clamp(34px,6vw,68px);letter-spacing:.05em}h2{margin:9px 0 22px;color:#62dfe0;font-size:clamp(17px,2.6vw,25px);font-weight:600}p{max-width:640px;margin:0 auto 18px;color:#b7cbd1;line-height:1.65}.status{margin-top:26px;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.055);font-weight:700;color:#e4f4f7}.error{color:#ffb8b8;border:1px solid rgba(255,90,90,.3)}.manual{display:inline-flex;margin-top:18px;padding:13px 22px;border-radius:999px;text-decoration:none;background:#d9b54a;color:#06131c;font-weight:800;visibility:hidden}
@media(max-width:650px){.toolbar{gap:8px;min-height:62px;padding:8px 10px}.identity span{display:none}.back,.open{padding:9px 12px;font-size:12px}.card{padding:28px 20px}}
</style>
</head>
<body>
<header class="toolbar">
<a class="back" href="./">← Volver al cluster</a>
<div class="identity"><strong>FARMAGEND 24/7</strong><span>DOSSIER DE PROYECTO · INVERSORES PRIVADOS</span></div>
<button id="openTop" class="open" type="button" aria-disabled="true">Abrir PowerPoint</button>
</header>
<main>
<section class="card">
<div class="mark">✦</div>
<h1>FARMAGEND</h1>
<h2>Dossier para inversores privados</h2>
<p>Presentación del proyecto FARMAGEND: modelo híbrido físico–digital, automatización 24/7, escalabilidad y modelo financiero.</p>
<div id="status" class="status">Preparando PowerPoint…</div>
<a id="manual" class="manual" href="#">Abrir PowerPoint</a>
</section>
</main>
<script>
const parts=['assets/farmagend/part00.txt','assets/farmagend/part01.txt','assets/farmagend/part02.txt','assets/farmagend/part03.txt','assets/farmagend/part04.txt','assets/farmagend/part05a.txt','assets/farmagend/part05b.txt','assets/farmagend/part05c.txt','assets/farmagend/part06.txt','assets/farmagend/part07.txt'];
const statusEl=document.getElementById('status');
const manual=document.getElementById('manual');
const openTop=document.getElementById('openTop');
let objectUrl='';
function launch(){if(!objectUrl)return;const a=document.createElement('a');a.href=objectUrl;a.download='FARMAGEND_Pitch_Inversores.pptx';document.body.appendChild(a);a.click();a.remove();}
openTop.addEventListener('click',launch);
manual.addEventListener('click',e=>{e.preventDefault();launch();});
(async()=>{
 try{
  const texts=await Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar '+p);return r.text();}));
  const b64=texts.join('').replace(/\s+/g,'');
  if(b64.length!==67240)throw new Error('La presentación está incompleta');
  const binary=atob(b64);if(binary.length!==50429)throw new Error('El archivo no tiene el tamaño esperado');
  const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
  objectUrl=URL.createObjectURL(blob);
  statusEl.textContent='PowerPoint preparado · 9 diapositivas';
  openTop.setAttribute('aria-disabled','false');manual.style.visibility='visible';
  setTimeout(launch,500);
 }catch(err){statusEl.textContent='No se pudo preparar la presentación: '+err.message;statusEl.classList.add('error');}
})();
window.addEventListener('beforeunload',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl)});
</script>
</body>
</html>
