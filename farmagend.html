<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FARMAGEND 24/7 | Dossier para inversores</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#06131c;color:#fff}
body{display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 50% 10%,#0d3441 0,#06131c 44%,#03090d 100%)}
.toolbar{min-height:70px;display:flex;align-items:center;gap:16px;padding:10px clamp(12px,3vw,32px);background:rgba(4,18,27,.96);border-bottom:1px solid rgba(65,213,209,.35);box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:10}
.back{display:inline-flex;align-items:center;text-decoration:none;border-radius:999px;padding:11px 18px;font-weight:800;white-space:nowrap;color:#081218;background:#d9b54a;border:1px solid #f1d06b}
.toolbar-logo{height:46px;width:auto;max-width:min(330px,42vw);object-fit:contain;background:#fff;border-radius:10px;padding:4px 8px}
.viewer-title{margin-left:auto;color:#8fb9c4;font-size:12px;letter-spacing:.08em;white-space:nowrap}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px clamp(10px,2vw,24px) 18px;gap:12px}
.brand{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:7px;padding:10px 0 4px}
.brand img{width:min(430px,82vw);height:auto;background:#fff;border-radius:14px;padding:7px 12px}
.brand h1{margin:0;color:#62dfe0;font-size:clamp(18px,2.5vw,28px)}
.brand p{margin:0;color:#b7cbd1;font-size:14px}
.viewer{flex:1;min-height:0;border:1px solid rgba(65,213,209,.28);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 20px 70px rgba(0,0,0,.32)}
.viewer iframe{width:100%;height:100%;border:0;display:block;background:#fff}
@media(max-width:680px){
 .toolbar{min-height:60px;padding:8px 10px;gap:8px}
 .back{padding:9px 12px;font-size:12px}
 .toolbar-logo{height:38px;max-width:48vw}
 .viewer-title{display:none}
 .brand{padding-top:4px}
 .brand img{width:min(340px,86vw)}
 .brand p{font-size:12px}
 main{padding:8px}
}
</style>
</head>
<body>
<header class="toolbar">
  <a class="back" href="./">← Volver al cluster</a>
  <img class="toolbar-logo" src="assets/farmagend-logo.png" alt="FARMAGEND 24/7">
  <span class="viewer-title">DOSSIER PARA INVERSORES PRIVADOS</span>
</header>
<main>
  <section class="brand">
    <img src="assets/farmagend-logo.png" alt="FARMAGEND 24/7 - Salud hoy. Tranquilidad siempre.">
    <h1>Dossier para inversores privados</h1>
    <p>Modelo híbrido físico-digital · Automatización 24/7 · Escalabilidad · Modelo financiero</p>
  </section>
  <section class="viewer">
    <iframe src="assets/FARMAGEND_Pitch_Inversores.pdf#view=FitH&toolbar=1&navpanes=0" title="Dossier FARMAGEND para inversores privados"></iframe>
  </section>
</main>
</body>
</html>
